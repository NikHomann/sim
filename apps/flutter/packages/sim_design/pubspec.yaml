name: sim_design
description: Design system of the Sim Flutter port - tokens, themes, fonts, icons and the emcn-equivalent widget set.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.10.8
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0
  vector_graphics: ^1.1.18

dev_dependencies:
  alchemist: ^0.14.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/emcn/
  fonts:
    - family: Season Sans
      fonts:
        - asset: assets/fonts/SeasonSansUprightsVF.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
