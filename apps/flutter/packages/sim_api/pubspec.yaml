name: sim_api
description: Sim backend client for the Flutter port - Dio client, streaming, SSE decoders, auth, uploads, persistence, query cache and the socket transport.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.8
  flutter: ">=3.38.0"

dependencies:
  cookie_jar: ^4.0.8
  crypto: ^3.0.6
  dio: ^5.9.0
  dio_cookie_manager: ^3.3.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  logging: ^1.3.0
  meta: ^1.16.0
  socket_io_client: ^3.1.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

flutter:
