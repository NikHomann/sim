name: sim_port_gen
description: Dart code generator for the Flutter port (reads apps/flutter/generated, writes generated/dart and generated/icons_vec). Run with `dart run tools/gen/main.dart` from apps/flutter.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  vector_graphics_compiler: ^1.1.19
