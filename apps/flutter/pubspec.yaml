name: sim_app
description: Flutter port of the Sim product app (web + Windows). See docs/port/00-plan.md.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  bloc: ^9.0.0
  clock: ^1.1.1
  collection: ^1.19.0
  equatable: ^2.0.7
  fast_immutable_collections: ^11.0.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_web_plugins:
    sdk: flutter
  get_it: ^8.0.0
  go_router: ^16.0.0
  markdown: ^7.3.1
  re_highlight: ^0.0.3
  sim_api:
    path: packages/sim_api
  sim_canvas:
    path: packages/sim_canvas
  sim_design:
    path: packages/sim_design
  sim_workflow:
    path: packages/sim_workflow
  url_launcher: ^6.3.0
  web: ^1.1.0
  window_manager: ^0.5.0

dev_dependencies:
  alchemist: 0.14.0
  bloc_test: ^10.0.0
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  fonts:
    # Chat code face (lib/features/chat/messages): SIL OFL 1.1, licence text
    # in the font's name table.
    - family: JetBrains Mono
      fonts:
        - asset: lib/features/chat/messages/fonts/JetBrainsMono-Regular.ttf
